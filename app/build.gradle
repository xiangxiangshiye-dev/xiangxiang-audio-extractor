plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xiangxiang.audioextractor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xiangxiang.audioextractor'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.9'
}
